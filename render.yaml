databases:
  - name: ai-workspace-database
    databaseName: ai_workspace
    user: ai_workspace
    plan: free
    ipAllowList: []

services:
  - type: web
    name: ai-workspace-manager
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-workspace-database
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_REQUEST_TIMEOUT_SECONDS
        value: "60"
      - key: GEMINI_API_KEY
        sync: false
