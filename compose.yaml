services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ai_workspace
      POSTGRES_USER: ai_workspace
      POSTGRES_PASSWORD: ai_workspace
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_workspace -d ai_workspace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
